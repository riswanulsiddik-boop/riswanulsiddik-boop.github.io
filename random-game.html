<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Guessing Game</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --radius: 16px;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .game-container {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .game-container:hover {
            transform: translateY(-2px);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: capitalize;
            color: #111827;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1.1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .status-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result {
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 28px;
            transition: color 0.2s ease;
        }

        .result.right {
            color: var(--success);
        }

        .result.wrong {
            color: var(--error);
        }

        .score-badge {
            display: inline-block;
            align-self: center;
            background: #f3f4f6;
            color: #374151;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #e5e7eb;
        }

        .restart-btn {
            background: #4b5563;
            margin-top: 10px;
            display: none;
        }

        .restart-btn:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <main class="game-container">
        <header>
            <h1>Guess The Number</h1>
            <p class="subtitle">Pick a random number between 1 and 10</p>
        </header>

        <section class="game-area">
            <div class="input-group">
                <input id="guessnumber" type="number" min="1" max="10" placeholder="Enter 1 - 10" autofocus>
                <button id="check-btn" onclick="check()">Check</button>
            </div>

            <div class="status-panel">
                <p id="result" class="result">Enter your guess above</p>
                <p id="totalscore" class="score-badge">score: 10</p>
                <button id="restart-btn" class="restart-btn" onclick="restartGame()">Play Again</button>
            </div>
        </section>
    </main>

    <script>
        var guessnumber = document.getElementById("guessnumber");
        var result = document.getElementById("result");
        var totalscore = document.getElementById("totalscore");
        var restartBtn = document.getElementById("restart-btn");
        var checkBtn = document.getElementById("check-btn");

        var randomNumber = Math.floor(Math.random() * 10) + 1;
        var score = 10;

        function check() {
            var enterednumber = Number(guessnumber.value);

            if (!guessnumber.value || isNaN(enterednumber)) {
                result.textContent = "Please enter a number!";
                result.className = "result wrong";
                return;
            }

            if (randomNumber === enterednumber) {
                result.textContent = "🎉 Correct! You won!";
                result.className = "result right";
                guessnumber.disabled = true;
                checkBtn.disabled = true;
                restartBtn.style.display = "inline-block";
            } else {
                score = score - 1;
                totalscore.textContent = "score: " + score;
                result.textContent = enterednumber > randomNumber ? "Wrong! Try a smaller number." : "Wrong! Try a larger number.";
                result.className = "result wrong";

                if (score <= 0) {
                    result.textContent = "Game Over! The number was " + randomNumber;
                    guessnumber.disabled = true;
                    checkBtn.disabled = true;
                    restartBtn.style.display = "inline-block";
                }
            }
        }

        function restartGame() {
            randomNumber = Math.floor(Math.random() * 10) + 1;
            score = 10;
            guessnumber.value = "";
            guessnumber.disabled = false;
            checkBtn.disabled = false;
            restartBtn.style.display = "none";
            totalscore.textContent = "score: 10";
            result.textContent = "Enter your guess above";
            result.className = "result";
            guessnumber.focus();
        }

        guessnumber.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                check();
            }
        });
    </script>
</body>
</html>
